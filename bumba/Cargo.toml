[package]
name = "bumba"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A single-process Brush shell with embedded make, Ninja, and uutils"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bumba"
path = "src/main.rs"

[dependencies]
anyhow = "1"
brush-core = { path = "vendor/brush-core" }
brush-builtins = { path = "vendor/brush-builtins" }
brush-coreutils-builtins = { path = "vendor/brush-coreutils-builtins", default-features = false }
brush-interactive = { path = "vendor/brush-interactive", default-features = false, features = ["reedline"] }
bytes = "1"
clap = { version = "4.6.0", features = ["derive"] }
findutils = { path = "vendor/findutils" }
futures-util = "0.3"
kati = { path = "vendor/kati" }
libc = "0.2"
n2 = { path = "vendor/n2", default-features = false }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uucore = "0.8"
uu_basename = "0.8"
uu_cat = "0.8"
uu_chmod = "0.8"
uu_chown = "0.8"
uu_cp = "0.8"
uu_cut = "0.8"
uu_dirname = "0.8"
uu_expr = "0.8"
uu_head = "0.8"
uu_id = "0.8"
uu_install = "0.8"
uu_ln = "0.8"
uu_mkdir = "0.8"
uu_mktemp = "0.8"
uu_mv = "0.8"
uu_nl = "0.8"
uu_nproc = "0.8"
uu_readlink = "0.8"
uu_realpath = "0.8"
uu_rm = "0.8"
uu_rmdir = "0.8"
uu_seq = "0.8"
uu_sort = "0.8"
uu_tac = "0.8"
uu_tail = "0.8"
uu_tee = "0.8"
uu_touch = "0.8"
uu_tr = "0.8"
uu_uname = "0.8"
uu_uniq = "0.8"
uu_wc = "0.8"
uu_whoami = "0.8"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
brush-core = { path = "vendor/brush-core" }
brush-builtins = { path = "vendor/brush-builtins" }
brush-coreutils-builtins = { path = "vendor/brush-coreutils-builtins" }
brush-interactive = { path = "vendor/brush-interactive" }
brush-parser = { path = "vendor/brush-parser" }
uucore = { path = "vendor/uucore" }
uu_basename = { path = "vendor/uu_basename" }
uu_cat = { path = "vendor/uu_cat" }
